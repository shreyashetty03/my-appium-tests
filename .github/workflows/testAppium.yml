name: Run Android Script on Emulator

on:
  push:
    branches: 
        - 'testBranch'
  workflow_dispatch:

jobs:
  run-on-emulator:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Licenses
        run: yes | sdkmanager --licenses

      - name: Install emulator and create AVD
        run: |
            sdkmanager "platform-tools" "emulator" "system-images;android-33;google_apis;x86_64"
            echo "no" | avdmanager create avd -n test -k "system-images;android-33;google_apis;x86_64" --device "pixel" --force

      - name: Start Android Emulator
        run: |
          nohup emulator -avd test-emulator -no-window -no-audio -no-boot-anim &
          adb wait-for-device
          adb shell input keyevent 82 &  # Unlock the emulator screen
        timeout-minutes: 5

      - name: Build the app
        run: ./gradlew assembleDebug

      - name: Install APK on emulator
        run: adb install -r $HOME/android-sdk/platform-tools/adb install demo.apk

        
      - name: Push JS script to emulator
        run: adb push test3.js /sdcard/test3.js

      - name: Trigger app to run JS
        run: adb shell am start -n "com.your.package/.JsRunnerActivity"