name: Boot Android Emulator and Launch App

on:
    push:
        branches: 
            - 'testBranch'
    workflow_dispatch:

jobs:
  android-emulator:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install emulator and system image
        run: |
          sdkmanager "platform-tools" "emulator" "platforms;android-30" "system-images;android-30;google_apis;x86_64"
          echo "no" | avdmanager create avd -n test -k "system-images;android-30;google_apis;x86_64" --device "pixel"

      - name: Start emulator
        run: |
          nohup emulator -avd test -no-snapshot-save -no-window -no-audio &
          adb wait-for-device
          adb shell getprop sys.boot_completed | grep 1
          sleep 30  # Allow extra time for full boot

      - name: Launch Chrome (or any package)
        run: |
          adb shell monkey -p com.android.chrome -c android.intent.category.LAUNCHER 1

      - name: Take screenshot
        run: |
          mkdir -p screenshots
          adb exec-out screencap -p > screenshots/chrome.png

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshot
          path: screenshots/chrome.png